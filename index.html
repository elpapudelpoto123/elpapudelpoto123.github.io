<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Executor - iOS Direct Install</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* IMAGEN CON MOVIMIENTO (GIF) */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2R3MWl2dnk1a3g2dXk1MjM0cTcwZDZzcnp3a3VjZDI3a3FxMzk1OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/98BthVRzyoX5u/giphy.gif');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .author {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
        }

        p {
            font-size: 15px;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0071e3 0%, #005bb5 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.3);
        }

        /* EFECTO DE DESTELLO ANIMADO EN EL BOTÓN */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: destello 3s infinite linear;
        }

        @keyframes destello {
            0% { left: -30%; }
            30% { left: 130%; }
            100% { left: 130%; }
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 24px rgba(0, 113, 227, 0.45);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Delta Executor iOS</h1>
        <div class="author">Direct Install por Enchidna</div>
        
        <p>Presiona el botón inferior para validar tu dispositivo Apple e iniciar la instalación del executor.</p>
        
        <!-- Tu nuevo enlace de YouTube configurado correctamente -->
        <a href="https://youtu.be/dQw4w9WgXcQ?si=TgrvvAdJTvhUhcTb" class="btn">
            Instalar Directamente
        </a>
    </div>

</body>
</html>
